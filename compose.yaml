services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: empathy
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: empathy
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U empathy -d empathy']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
