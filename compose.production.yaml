# One immutable image built in CI/on PC; never build on the 1CPU/2GB VM.
# Example bootstrap: set PG_PASSWORD and APP_IMAGE only in hosting/ignored env.
name: between
services:
  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: empathy
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set a unique production database password}
      POSTGRES_DB: empathy
    command: ['postgres','-c','shared_buffers=64MB','-c','work_mem=2MB','-c','maintenance_work_mem=32MB','-c','max_connections=20','-c','log_statement=none','-c','log_min_error_statement=panic','-c','log_error_verbosity=terse']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U empathy -d empathy']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.25
    logging:
      driver: none
    networks:
      private:
        ipv4_address: 172.30.23.4
  app:
    image: ${APP_IMAGE:?Set an immutable CI/PC-built tag or digest}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the private db connection URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set bot token privately}
      AI_PROVIDER: local
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:?Set private Tailscale endpoint /v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:?Set actual model alias}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:?Set endpoint authentication key}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-90000}
      AI_MAX_CONCURRENCY: 1
      AI_MAX_QUEUE_LENGTH: 8
      SMTP_HOST: ${SMTP_HOST:?Set SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set sender email}
      EMAIL_CODE_SECRET: ${EMAIL_CODE_SECRET:?Set unique random hex secret}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set actual HTTPS origin}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?Set independent random hex secret}
      WEB_LINK_SECRET: ${WEB_LINK_SECRET:?Set independent random hex secret}
      PORT: 3000
      TRUSTED_PROXY_IPS: 172.30.23.2
    networks:
      private:
        ipv4_address: 172.30.23.3
    mem_limit: 640m
    cpus: 0.65
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 120s
    logging:
      driver: none
  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:?Set actual HTTPS origin}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      private:
        ipv4_address: 172.30.23.2
    mem_limit: 64m
    cpus: 0.10
    logging:
      driver: none
networks:
  private:
    ipam:
      config:
        - subnet: 172.30.23.0/29
volumes:
  caddy_data:
  caddy_config:
  # Separate name: does not delete/replace the old development volume.
  pgdata:
