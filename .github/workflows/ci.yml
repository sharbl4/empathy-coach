name: Web and Telegram CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:contracts
      - run: node scripts/check-compose.mjs
      - name: Parse Windows deployment scripts without running installers/firewall
        shell: pwsh
        run: |
          Get-ChildItem deploy/model/*.ps1 | ForEach-Object {
            $parseTokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$parseTokens,[ref]$parseErrors) | Out-Null
            if($parseErrors.Count){throw "PowerShell syntax errors in $($_.Name)"}
          }
  web-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @between/contracts
      - run: npm run typecheck -w @between/web
      - run: npm run build:web
  domain-bot-web-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: empathy
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: empathy_runtime
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U empathy -d empathy_runtime"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://empathy:ci_only@127.0.0.1:5432/empathy_runtime
      TEST_DATABASE_URL: postgresql://empathy:ci_only@127.0.0.1:5432/empathy_domain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build real facade and Telegram entry; missing participants block integration
        run: npm run build
      - run: npm run typecheck
      - name: Migrations on empty runtime and isolated DB, repeated safely
        run: |
          docker exec '${{ job.services.postgres.id }}' createdb -U empathy empathy_domain_test
          npm run db:migrate
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
      - name: Required new facade DB tests and transport tests, never legacy substitutes
        run: npm test
      - name: Preserved legacy SQL/domain regressions (not new live acceptance)
        run: npm run test:legacy
      - name: Mandatory browser linked login and common history with isolated test adapters
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - run: docker build -t between-product:${{ github.sha }} .
      - name: Production dependency closure and import without user-facing server
        run: |
          timeout 10s docker run --rm --network none between-product:${{ github.sha }} node --input-type=module -e "const d=await import('@between/api'),h=await import('@between/api/http'),t=await import('@between/bot');if(typeof d.createDomain!=='function'||typeof h.createHttpAdapter!=='function'||typeof t.createTelegramTransport!=='function')process.exit(1)"
# Real test-bot/QQCloud/home-GPU/SMTP/network/load/phone gates remain separate.
